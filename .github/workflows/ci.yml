name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-site:
    name: Documentation site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install documentation generator
        shell: bash
        run: python3 -m pip install --disable-pip-version-check mkdocs==1.6.1

      - name: Check documentation links
        shell: bash
        run: python3 tests/docs/check-links.py .

      - name: Build documentation site
        shell: bash
        run: mkdocs build --clean

      - name: Upload documentation site
        uses: actions/upload-artifact@v4
        with:
          name: liquid-documentation-site
          path: site/
          if-no-files-found: error

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            platform: linux
          - name: macOS
            runner: macos-15
            platform: macos
          - name: Windows
            runner: windows-2022
            platform: windows
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORAMA_SUBMODULES_TOKEN }}

      - name: Install Linux toolchain
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates gpg software-properties-common wget
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo gpg --dearmor --yes --output /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install --yes autoconf automake clang-19 clang-format-19 cmake fuse3 libfuse3-dev libssl-dev libstdc++-14-dev ninja-build postgresql postgresql-client squashfs-tools zlib1g-dev

      - name: Install macOS toolchain
        if: matrix.platform == 'macos'
        shell: bash
        run: brew install cmake llvm ninja openssl@3 postgresql@17

      - name: Install Windows build tools
        if: matrix.platform == 'windows'
        shell: cmd
        run: choco upgrade cmake ninja openssl --yes --no-progress

      - name: Verify Windows toolchain
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          where clang-cl
          cmake --version
          ninja --version

      - name: Configure
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja

      - name: Configure Windows
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          cmake -S . -B build -G Ninja "-DOPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64"

      - name: Build
        if: matrix.platform != 'windows'
        shell: bash
        run: cmake --build build

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          cmake --build build

      - name: Test
        if: matrix.platform != 'windows'
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: Test Windows
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          ctest --test-dir build --output-on-failure

      - name: Run AppImage extraction peer
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/projection-peers"
          LIQUID_PROJECTION_PEER_OUT="$RUNNER_TEMP/projection-peers" \
            ./build/tests/liquid-tests \
            --gtest_filter=Projection.emit_peer_artifacts_when_requested \
            --gtest_color=no
          "$RUNNER_TEMP/projection-peers/appimage/liquid-fixture-1.2.3-x86_64.AppImage" \
            --appimage-extract-and-run

      - name: Run Homebrew bottle peer
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          tools/projection-peers/run-homebrew-interop.sh \
            "$PWD/build/tests/liquid-tests" \
            "$PWD/build/liquid-hot-demo" \
            "$RUNNER_TEMP/homebrew-projection-peer"

      - name: Run liquid version
        if: matrix.platform != 'windows'
        shell: bash
        run: ./build/liquid version

      - name: Run liquid version on Windows
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          build\liquid.exe version

  linux-sanitizers:
    name: Linux sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORAMA_SUBMODULES_TOKEN }}

      - name: Install toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates gpg software-properties-common wget
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo gpg --dearmor --yes --output /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install --yes autoconf automake clang-19 clang-format-19 cmake fuse3 libfuse3-dev libssl-dev libstdc++-14-dev ninja-build postgresql postgresql-client squashfs-tools zlib1g-dev

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined \
            -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

  self-host:
    name: Linux self-host
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.ORAMA_SUBMODULES_TOKEN }}

      - name: Install toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates gpg software-properties-common wget
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo gpg --dearmor --yes --output /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install --yes autoconf automake clang-19 clang-format-19 cmake fuse3 libfuse3-dev libstdc++-14-dev ninja-build

      - name: Configure at the fixed build root
        shell: bash
        run: |
          sudo mkdir -p /liquid/work
          sudo mount --bind "$GITHUB_WORKSPACE" /liquid/work
          test -c /dev/fuse
          cmake -S /liquid/work -B /liquid/work/.liquid-build/cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIQUID_BUILD_TESTS=OFF \
            -DLIQUID_SELF_HOST=ON
          cmake -S /liquid/work -B /liquid/work/build-wrapped -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIQUID_BUILD_TESTS=OFF \
            -DLIQUID_SELF_HOST=ON

      - name: Build the CMake bootstrap
        shell: bash
        working-directory: /liquid/work
        run: cmake --build .liquid-build/cmake -- -j2

      - name: Build liquid with liquid twice
        shell: bash
        working-directory: /liquid/work
        run: |
          export LIQUID_WRAP_CACHE=/liquid/work/.liquid-build/self-host-cache
          ./.liquid-build/cmake/liquid wrap --no-verify \
            cmake --build build-wrapped -- -j2 | tee "$RUNNER_TEMP/self-host-first.txt"
          ./.liquid-build/cmake/liquid wrap --no-verify \
            cmake --build build-wrapped -- -j2 | tee "$RUNNER_TEMP/self-host-second.txt"
          grep -Eq '^actions=[1-9][0-9]* hits=[1-9][0-9]* misses=0 processes_started=0 probes_started=0 outer=hit$' \
            "$RUNNER_TEMP/self-host-second.txt"
          grep -Eq '^disk_hit_rate=100\.00% ' "$RUNNER_TEMP/self-host-second.txt"

      - name: Compare bootstrap outputs
        shell: bash
        working-directory: /liquid/work
        run: |
          test "$(./.liquid-build/cmake/liquid version)" = \
            "$(./build-wrapped/liquid version)"
          cmp .liquid-build/cmake/libliquid.a build-wrapped/libliquid.a
          cmp .liquid-build/cmake/liquid build-wrapped/liquid

      - name: Build shared libliquid
        shell: bash
        working-directory: /liquid/work
        run: |
          cmake -S . -B .liquid-build/shared -G Ninja \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIQUID_BUILD_TESTS=OFF
          cmake --build .liquid-build/shared -- -j2
          ./.liquid-build/shared/liquid version
