services:
  scheduler:
    build:
      context: ../..
      dockerfile: deploy/workers/Dockerfile.scheduler
    network_mode: host
    volumes:
      - scheduler-store:/var/lib/liquid-scheduler
      - scheduler-identity:/var/lib/liquid-identity
      - ./trust:/etc/liquid:ro

  worker-one:
    build:
      context: ../..
      dockerfile: deploy/workers/Dockerfile.worker
    command:
      - --scheduler
      - 127.0.0.1:50051
      - --trust-scheduler
      - /etc/liquid/scheduler
      - --control-listen
      - 127.0.0.1:8081
      - --root
      - /var/lib/liquid-worker
    network_mode: host
    privileged: true
    depends_on:
      - scheduler
    volumes:
      - worker-one-store:/var/lib/liquid-worker
      - worker-one-identity:/var/lib/liquid-identity
      - ./trust:/etc/liquid:ro

  worker-two:
    build:
      context: ../..
      dockerfile: deploy/workers/Dockerfile.worker
    command:
      - --scheduler
      - 127.0.0.1:50051
      - --trust-scheduler
      - /etc/liquid/scheduler
      - --control-listen
      - 127.0.0.1:8082
      - --root
      - /var/lib/liquid-worker
    network_mode: host
    privileged: true
    depends_on:
      - scheduler
    volumes:
      - worker-two-store:/var/lib/liquid-worker
      - worker-two-identity:/var/lib/liquid-identity
      - ./trust:/etc/liquid:ro

volumes:
  scheduler-store:
  scheduler-identity:
  worker-one-store:
  worker-one-identity:
  worker-two-store:
  worker-two-identity:
